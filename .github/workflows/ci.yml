name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: BG_DATABASE_URL=sqlite:///migration.db alembic upgrade head && BG_DATABASE_URL=sqlite:///migration.db alembic downgrade base
  postgres-contention:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: browsergrid
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: browsergrid_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U browsergrid -d browsergrid_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head
        env:
          BG_DATABASE_URL: postgresql+psycopg://browsergrid:ci-only-password@localhost/browsergrid_test
      - run: pytest tests/test_postgres.py -q
        env:
          BG_TEST_DATABASE_URL: postgresql+psycopg://browsergrid:ci-only-password@localhost/browsergrid_test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci && npm run typecheck && npm run build
        working-directory: apps/web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web
  runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm ci && node --test tests/*.test.cjs
        working-directory: runtimes
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python infra/scripts/report_contract.py
  isolated-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: cp .env.example .env && docker compose up --build -d
      - run: python infra/scripts/e2e.py
        env:
          BG_E2E_COMMIT: ${{ github.sha }}
          BG_E2E_REPOSITORY: https://github.com/${{ github.repository }}
      - run: python infra/scripts/network_e2e.py --disposable-stack
      - run: python infra/scripts/recovery_e2e.py --disposable-stack
      - if: always()
        run: docker compose logs --no-color > compose-e2e.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: execution-evidence, path: compose-e2e.log}
      - if: always()
        run: docker compose down -v
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install pip-audit && pip-audit -r requirements.lock
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo
