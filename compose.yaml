name: browsergrid
x-app: &app
  build:
    context: .
    dockerfile: infra/docker/python.Dockerfile
  image: browsergrid-control:0.1.0
  env_file: .env
  environment: &env
    BG_DATABASE_URL: postgresql+psycopg://browsergrid:${POSTGRES_PASSWORD:-browsergrid-local-development-only}@postgres/browsergrid
    BG_REDIS_URL: redis://redis:6379/0
    BG_KEY_FILE: /state/encryption.key
    BG_S3_ENDPOINT: http://minio:9000
    BG_S3_PUBLIC_ENDPOINT: ${BG_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    BG_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-browsergrid-local}
    BG_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-browsergrid-local-development-only}
    BG_ORIGINS: ${BG_ORIGINS:-http://localhost:3000}
  networks: [control]
  volumes: [state:/state:ro]
  restart: unless-stopped
services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: browsergrid
      POSTGRES_DB: browsergrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-browsergrid-local-development-only}
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U browsergrid -d browsergrid"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    networks: [control]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-browsergrid-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-browsergrid-local-development-only}
    volumes: [objects:/data]
    ports: ['127.0.0.1:9000:9000','127.0.0.1:9001:9001']
    networks: [control]
    restart: unless-stopped
  init:
    <<: *app
    user: root
    command: [python, init.py]
    restart: 'no'
    volumes: [state:/state]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  runtime:
    build:
      context: .
      dockerfile: runtimes/Dockerfile
    image: browsergrid-runtime:1.58.2
    network_mode: none
    entrypoint: ['true']
    restart: 'no'
  api:
    <<: *app
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      init: {condition: service_completed_successfully}
  scheduler:
    <<: *app
    command: [python, -m, browsergrid.scheduler]
    healthcheck: {disable: true}
    depends_on:
      init: {condition: service_completed_successfully}
  worker:
    <<: *app
    user: root
    command: [python, -m, browsergrid.worker]
    healthcheck: {disable: true}
    volumes: [state:/state:ro, /var/run/docker.sock:/var/run/docker.sock]
    environment:
      <<: *env
      BG_RUNTIME_IMAGE: browsergrid-runtime:1.58.2
      BG_SANDBOX_NETWORK: browsergrid_sandbox
      BG_EGRESS_PROXY: http://egress:3128
    depends_on:
      init: {condition: service_completed_successfully}
      runtime: {condition: service_completed_successfully}
      egress: {condition: service_started}
      watchdog: {condition: service_started}
    stop_grace_period: 20s
  watchdog:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    image: browsergrid-control:0.1.0
    user: root
    command: [python, -m, browsergrid.watchdog]
    network_mode: none
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    healthcheck: {disable: true}
    restart: unless-stopped
  egress:
    build:
      context: .
      dockerfile: infra/docker/egress.Dockerfile
    networks: [sandbox,egress]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  fixture-app:
    build:
      context: .
      dockerfile: fixture-app/Dockerfile
    networks:
      sandbox:
        ipv4_address: 172.30.0.10
    cap_drop: [ALL]
    read_only: true
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BG_API_INTERNAL_URL: http://api:8000
    networks: [control]
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped
networks:
  control: {}
  sandbox:
    name: browsergrid_sandbox
    internal: true
    ipam:
      config: [{subnet: 172.30.0.0/24}]
  egress: {}
volumes:
  postgres: {}
  redis: {}
  objects: {}
  state: {}
