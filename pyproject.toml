[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "browsergrid"
version = "0.1.0"
description = "Self-hosted isolated browser execution infrastructure"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "redis>=5,<7", "boto3>=1.36,<2", "argon2-cffi>=23,<26", "cryptography>=44,<47", "python-multipart>=0.0.20,<1", "docker>=7.1,<8", "pydantic-settings>=2.7,<3", "Pillow>=11,<13", "httpx>=0.28,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
browsergrid = "cli.main:main"
[tool.setuptools.packages.find]
include = ["browsergrid*", "cli*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
"browsergrid.execution" = ["seccomp.json"]
